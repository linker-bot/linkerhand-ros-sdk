name: Release

# This repository publishes nothing: the documented install path is
# ``git clone --branch v<version>`` plus ``colcon build``, and
# ``linkerbot_hand_msgs`` is a ROSIDL interface with no platform-independent
# wheel. So a release is just a tag, and what CI can usefully do on a tag push is
# confirm the tag landed on a commit that is actually consistent with it.
#
# That is the failure this catches. The 2.0.0 tag was pushed while the
# documentation fix was still unmerged, so it pointed at a commit whose docs said
# 1.0.0. The tag had to be deleted from the remote and redone.
on:
  push:
    tags: ["v*"]

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: python -m pip install packaging

      # The same script the local release flow runs, so there is one set of
      # gates rather than one here and another on a developer machine. Only the
      # tag-consistency gates run in CI; the rest need the ROS toolchain and
      # already ran locally before the tag was pushed.
      - name: The tag must match every version this commit declares
        run: python scripts/release.py verify-tag --tag "${{ github.ref_name }}"
